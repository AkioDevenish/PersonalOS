name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphonesimulator
      - uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ hashFiles('ios/**/Package.resolved') }}
      - name: Pick a simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("SimRuntime.iOS-"))
                | (.key | capture("iOS-(?<v>[0-9-]+)").v | split("-") | map(tonumber)) as $v
                | .value[] | select(.name | startswith("iPhone")) | {v: $v, udid}]
                | sort_by(.v) | last | .udid')
          test -n "$udid" && test "$udid" != null
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$udid"
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/PersonalOSHealth.xcodeproj \
            -scheme PersonalOSHealth \
            -destination "id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO
